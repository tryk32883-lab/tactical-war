name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(which sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" \
            "platforms;android-33" "platforms;android-34" \
            "build-tools;33.0.2" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Install Godot 4.3 and export templates
        run: |
          mkdir -p "$HOME/godot"
          cd "$HOME/godot"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          TPL_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TPL_DIR"
          unzip -q Godot_v4.3-stable_export_templates.tpz -d tpl
          mv tpl/templates/* "$TPL_DIR/"
          godot --version

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$HOME/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > "$HOME/.config/godot/editor_settings-4.3.tres"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Fill keystore into export preset
        run: |
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$HOME/debug.keystore\"|" export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|' export_presets.cfg
          grep keystore/debug export_presets.cfg

      - name: Diagnose export setup
        run: |
          echo "--- template dir ---"
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable/" || true
          echo "--- sdk / java ---"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" || true
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          echo "--- godot editor settings ---"
          cat "$HOME/.config/godot/editor_settings-4.3.tres" || true

      - name: Export debug APK
        run: |
          mkdir -p build
          set +e
          godot --headless --verbose --export-debug "Android" build/tactical-war.apk > export.log 2>&1
          code=$?
          echo "=== последние строки лога экспорта ==="
          grep -v "is not exposed" export.log | tail -120
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tactical-war-apk
          path: build/tactical-war.apk
